<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect width="1080" height="1080" fill="#000000"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Clock face -->
    <circle cx="540" cy="540" r="250"/>
    <!-- Hour ticks -->
    <line x1="540" y1="310" x2="540" y2="340"/>
    <line x1="540" y1="740" x2="540" y2="770"/>
    <line x1="310" y1="540" x2="340" y2="540"/>
    <line x1="740" y1="540" x2="770" y2="540"/>
    <!-- Clock hands -->
    <line x1="540" y1="540" x2="540" y2="390"/>
    <line x1="540" y1="540" x2="660" y2="540"/>
    <!-- Center dot -->
    <circle cx="540" cy="540" r="10" fill="#FFFFFF"/>
  </g>
</svg>
