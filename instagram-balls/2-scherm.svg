<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect width="1080" height="1080" fill="#000000"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Phone body -->
    <rect x="390" y="230" width="300" height="480" rx="38" ry="38"/>
    <!-- Speaker -->
    <line x1="505" y1="280" x2="575" y2="280"/>
    <!-- Home indicator -->
    <line x1="495" y1="660" x2="585" y2="660"/>
    <!-- Crack pattern (screen repair) -->
    <polyline points="460,330 520,410 480,470 560,530 510,610"/>
    <polyline points="520,410 600,380"/>
    <polyline points="560,530 620,500"/>
  </g>
  <text x="540" y="870" font-family="Helvetica, Arial, sans-serif" font-size="110" font-weight="300" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">SCHERM</text>
</svg>
